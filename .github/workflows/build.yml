name: build
on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  DIR: .
  FILE: yury_bely_cv

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v2
        with:
          root_file: ${{ env.FILE }}.tex
          working_directory: ${{ env.DIR }}

      - name: Install Pandoc
        run: sudo apt-get install -y pandoc

      - name: Convert LaTeX to DOCX
        run: pandoc ${{ env.DIR }}/${{ env.FILE }}.tex -o ${{ env.DIR }}/${{ env.FILE }}.docx

      - name: Stage files for Pages
        run: mkdir -p _pages && cp ${{ env.DIR }}/${{ env.FILE }}.pdf ${{ env.DIR }}/${{ env.FILE }}.docx _pages/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _pages

  deploy:
    needs: [build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
